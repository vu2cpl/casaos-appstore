# Generated by scripts/update_immich.py from the official Immich v3.2.4 release compose:
# https://github.com/immich-app/immich/releases/tag/v3.2.4
# Do not edit by hand.
name: vu2cpl-immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.2.4
    volumes:
    - /DATA/Gallery/immich:/data
    - /etc/localtime:/etc/localtime:ro
    ports:
    - 2283:2283
    depends_on:
    - redis
    - database
    restart: always
    healthcheck:
      disable: false
    environment:
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    x-casaos:
      envs: []
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.4
    volumes:
    - model-cache:/cache
    restart: always
    healthcheck:
      disable: false
    environment:
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    x-casaos:
      envs: []
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    x-casaos:
      envs: []
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
    - /DATA/AppData/$AppID/pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    x-casaos:
      envs: []
volumes:
  model-cache: null
x-casaos:
